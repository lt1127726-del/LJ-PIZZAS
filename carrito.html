<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Carrinho | LJ PIZZAS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    color:white;
}

/* HEADER */

header{
    background:#1b1b1b;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid #ff9800;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
}

.logo h1{
    color:#FFD54F;
    font-size:32px;
}

/* CONTENEDOR */

.container{

    width:95%;
    max-width:900px;

    margin:40px auto;

}

/* TITULO */

.titulo{

    text-align:center;

    color:#FFD54F;

    font-size:36px;

    margin-bottom:40px;

}

/* TARJETAS */

.produto{

    background:#222;

    border-radius:15px;

    padding:20px;

    margin-bottom:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border:2px solid #333;

    transition:.3s;

}

.produto:hover{

    border-color:#ff9800;

}

/* INFORMACION */

.info h3{

    color:#FFD54F;

    font-size:24px;

    margin-bottom:8px;

}

.info p{

    color:#ddd;

    font-size:18px;

}

/* CANTIDAD */

.quantidade{

    display:flex;

    align-items:center;

    gap:15px;

}

.quantidade button{

    width:40px;

    height:40px;

    border:none;

    border-radius:50%;

    background:#ff9800;

    color:white;

    font-size:24px;

    cursor:pointer;

}

.quantidade span{

    font-size:24px;

    width:35px;

    text-align:center;

}

/* RESUMEN */

.resumo{

    margin-top:40px;

    background:#222;

    border-radius:15px;

    padding:25px;

    border:2px solid #ff9800;

}

.resumo h2{

    color:#FFD54F;

    margin-bottom:20px;

}

.resumo p{

    font-size:22px;

    margin:12px 0;

}

/* BOTONES */

.botoes{

    display:flex;

    justify-content:space-between;

    margin-top:35px;

    gap:20px;

}

.botao{

    flex:1;

    padding:18px;

    border:none;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

.voltar{

    background:#444;

    color:white;

}

.voltar:hover{

    background:#666;

}

.whatsapp{

    background:#25D366;

    color:white;

}

.whatsapp:hover{

    background:#1fa851;

}
/* =========================================
   RESPONSIVE TABLETS
========================================= */

@media (max-width:992px){

    .container{
        width:94%;
        margin:30px auto;
    }

    .logo h1{
        font-size:28px;
    }

    .titulo{
        font-size:30px;
    }

    .produto{
        padding:18px;
    }

    .info h3{
        font-size:21px;
    }

    .info p{
        font-size:17px;
    }

    .resumo{
        margin:30px 15px;
    }

}

/* =========================================
   RESPONSIVE CELULARES
========================================= */

@media (max-width:768px){

    header{
        padding:15px;
        justify-content:center;
    }

    .logo{
        flex-direction:column;
        gap:8px;
    }

    .logo img{
        width:55px;
        height:55px;
    }

    .logo h1{
        font-size:24px;
        text-align:center;
    }

    .container{
        width:95%;
        margin:20px auto;
    }

    .titulo{
        font-size:28px;
        margin-bottom:25px;
    }

    .produto{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
        padding:18px;
    }

    .info{
        width:100%;
    }

    .info h3{
        font-size:20px;
        line-height:1.4;
    }

    .info p{
        font-size:17px;
    }

    .quantidade{
        width:100%;
        justify-content:center;
    }

    .quantidade button{
        width:45px;
        height:45px;
        font-size:24px;
    }

    .quantidade span{
        font-size:22px;
    }

    .resumo{
        margin:25px 15px;
        padding:20px;
    }

    .resumo h2{
        font-size:24px;
    }

    .resumo p{
        font-size:18px;
    }

    .botoes{
        flex-direction:column;
        margin:25px 15px;
    }

    .botao{
        width:100%;
        font-size:18px;
        padding:16px;
    }

}

/* =========================================
   CELULARES PEQUEÑOS
========================================= */

@media (max-width:480px){

    .logo h1{
        font-size:21px;
    }

    .titulo{
        font-size:24px;
    }

    .info h3{
        font-size:18px;
    }

    .info p{
        font-size:15px;
    }

    .resumo h2{
        font-size:21px;
    }

    .resumo p{
        font-size:16px;
    }

    .quantidade button{
        width:40px;
        height:40px;
    }

    .botao{
        font-size:16px;
        padding:15px;
    }

}
</style>

</head>

<body>

<header>

<div class="logo">

<img src="0.png">

<h1>LJ PIZZAS</h1>

</div>

</header>

<div class="container">

<h2 class="titulo">

🛒 Meu Pedido

</h2>

<div id="listaProdutos"></div>

</div>

<div class="resumo">

<h2>Resumo do Pedido</h2>

<p>
Total de itens:
<strong id="totalItens">0</strong>
</p>

<p>
Total:
<strong id="valorTotal">
R$ 0,00
</strong>
</p>

</div>

<div class="botoes">

<button class="botao voltar"
onclick="window.location.href='index.html'">

← Continuar Comprando

</button>

<button class="botao whatsapp" onclick="enviarWhatsApp()">

📲 Pedido pelo WhatsApp

</button>

</div>

</div>
<script src="../JS/carrito.js"></script>

<script>

const listaProdutos = document.getElementById("listaProdutos");

function carregarCarrito(){

    let total = 0;
    let itens = 0;

    const carrito = obtenerCarrito();
if(carrito.length === 0){

    listaProdutos.innerHTML =
        "<p style='text-align:center;font-size:22px'>Seu carrinho está vazio.</p>";

    document.getElementById("totalItens").textContent = "0";

    document.getElementById("valorTotal").textContent = "R$ 0,00";

    return;

}

    listaProdutos.innerHTML = "";

    carrito.forEach((produto, indice)=>{

        total += produto.precio * produto.cantidad;
        itens += produto.cantidad;

        listaProdutos.innerHTML += `
        <div class="produto">

            <div class="info">
                <h3>${produto.nombre}</h3>
                <p>R$ ${produto.precio.toFixed(2)}</p>
            </div>

            <div class="quantidade">

                <button onclick="menos(${indice})">-</button>

                <span>${produto.cantidad}</span>

                <button onclick="mais(${indice})">+</button>
            </div>
            </div>
        `;

    });

    document.getElementById("totalItens").textContent = itens;

    document.getElementById("valorTotal").textContent =
        "R$ " + total.toFixed(2);

}

function mais(indice){

    aumentarCantidad(indice);

    carregarCarrito();
    actualizarContador();

}

function menos(indice){

    diminuirCantidad(indice);

    carregarCarrito();
    actualizarContador();

}

carregarCarrito();
function enviarWhatsApp(){

    const carrito = obtenerCarrito();

    if(carrito.length === 0){

        alert("Seu carrinho está vazio.");

        return;

    }

    let mensagem = "🍕 *NOVO PEDIDO - LJ PIZZAS*%0A%0A";

    let total = 0;
    let itens = 0;

    carrito.forEach(produto=>{

        mensagem +=
        produto.cantidad + "x " +
        produto.nombre +
        "%0A";

        mensagem +=
        "R$ " +
        (produto.precio * produto.cantidad).toFixed(2) +
        "%0A%0A";

        total += produto.precio * produto.cantidad;
        itens += produto.cantidad;

    });

    mensagem += "----------------------------%0A";
    mensagem += "🛒 Total de itens: " + itens + "%0A";
    mensagem += "💰 Total: R$ " + total.toFixed(2);

    window.open(
        "https://wa.me/559684241554?text=" + mensagem,
        "_blank"
    );

}

</script>
</body>
</html>
